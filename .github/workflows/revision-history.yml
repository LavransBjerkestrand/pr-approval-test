name: Update revision history

on:
  pull_request:
    types: [closed]

concurrency:
  group: revision-history
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  update-revision-history:
    if: >
      github.event.pull_request.merged == true &&
      !startsWith(
        github.event.pull_request.head.ref,
        'automation/revision-history-'
      )

    runs-on: ubuntu-latest

    env:
      REVISION_HISTORY_DIRECTORY: docs

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update revision history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node .github/scripts/update-revision-history.ts

      # Needed to enforce "Require a pull request before merging" in the repository settings, we need to push using SSH and a Deploy key, as it can be excluded from the branch protection ruleset.
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.REVISION_HISTORY_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push revision history
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/

          git commit \
            -m "docs: record revision history for #${{ github.event.pull_request.number }}"

          git remote set-url origin "git@github.com:${{ github.repository }}.git"

          git push origin main
